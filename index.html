<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בדיקת מסד נתונים - סרטים</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .card { background: #2a2a2a; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; }
        h2 { margin-top: 0; color: #ffd700; }
    </style>
</head>
<body>
    <h1>הסרטים במסד הנתונים:</h1>
    <div id="movies-container"></div>

    <script>
        fetch('movies.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('movies-container');
                data.movies.forEach(movie => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <h2>${movie.title} (${movie.release_year})</h2>
                        <p><strong>במאי:</strong> ${movie.director}</p>
                        <p><strong>שחקנים:</strong> ${movie.cast.join(', ')}</p>
                        <p><strong>אוסקרים:</strong> ${movie.oscar_wins.join(', ')}</p>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(error => {
                document.getElementById('movies-container').innerHTML = '<p style="color:red;">שגיאה בטעינת הנתונים. האם פתחת דרך שרת מקומי?</p>';
                console.error('Error fetching movies:', error);
            });
    </script>
</body>
</html>
