    <!-- App version (bump on every release to force PWA self-update) -->
    <meta name="app-version" content="1.8.4" />

    <!-- Force-update gate: must run BEFORE service worker registration -->
    <script>
      (function () {
        var APP_VERSION = '1.8.4';
        try {
          var stored = localStorage.getItem('cinemaster_version');
          if (stored && stored !== APP_VERSION) {
            console.log('🆕 New app version detected (' + stored + ' → ' + APP_VERSION + ') — purging caches');
            var done = function () {
              try { localStorage.setItem('cinemaster_version', APP_VERSION); } catch (e) {}
              window.location.reload();
            };
            var clearAll = Promise.resolve();
            if (window.caches && caches.keys) {
              clearAll = caches.keys()
                .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
                .catch(function () {});
            }
            clearAll
              .then(function () {
                if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                  return navigator.serviceWorker.getRegistrations()
                    .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
                    .catch(function () {});
                }
              })
              .then(done, done);
            return;
          }
          if (!stored) localStorage.setItem('cinemaster_version', APP_VERSION);
        } catch (e) {}
      })();
    </script>

    <!-- Cinematic typography: Limelight (marquee) + Cinzel (Art Deco) + Inter (body) -->

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Register Service Worker with auto-update on every load -->
    <script>
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          console.log('🔄 New service worker took control - reloading');
          window.location.reload();
        });

        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/service-worker.js', { updateViaCache: 'none' })
            .then(function (registration) {
              console.log('✅ Service Worker registered:', registration.scope);

              // Force an update check on every load (bypasses HTTP cache)
              registration.update().catch(function () {});

              function trackInstalling(worker) {
                worker.addEventListener('statechange', function () {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('⏭️ New SW installed — activating immediately');
                    worker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }

              if (registration.waiting) {
                console.log('⏭️ SW already waiting — activating');
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              if (registration.installing) {
                trackInstalling(registration.installing);
              }
              registration.addEventListener('updatefound', function () {
                if (registration.installing) trackInstalling(registration.installing);
              });

              // Re-check on visibility (e.g. user returns to tab/PWA)
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(function () {});
                }
              });
            })
            .catch(function (error) {
              console.log('❌ Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
